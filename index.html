<!doctype html>
<html lang="en" data-theme="dark" data-tone="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Saivinod Kotipalli | AWS DevOps Engineer</title>
    <meta name="description" content="Cinematic, interactive AWS DevOps engineering portfolio of Saivinod Kotipalli featuring progressive editorial typography, live cloud architecture diagrams, CI/CD pipelines, and observability visualizers." />
    <meta property="og:title" content="Saivinod Kotipalli | AWS DevOps Engineer" />
    <meta property="og:description" content="Cinematic, interactive AWS DevOps engineering portfolio of Saivinod Kotipalli featuring progressive editorial typography, live cloud architecture diagrams, CI/CD pipelines, and observability visualizers." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Saivinod Kotipalli Portfolio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#07080b" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sk_theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.tone = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = theme === 'dark' ? '#07080b' : '#f3f2ee';
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
